name: serverless-starter
description: Pulumi Serverless starter project - deploy AWS Lambda, API Gateway and DynamoDB
runtime:
  name: python
  options:
    toolchain: pip
    virtualenv: venv
config:
  pulumi:tags:
    value:
      pulumi:template: aws-python

  # Project name prefix for all resources
  serverless-starter:projectName:
    type: string
    default: serverless-app
    description: Prefix for all resource names

  # DynamoDB Configuration
  serverless-starter:enableDynamoDB:
    type: boolean
    default: true
    description: Enable DynamoDB table creation
  serverless-starter:dynamodbTableName:
    type: string
    default: app-table
    description: DynamoDB table name
  serverless-starter:dynamodbHashKey:
    type: string
    default: id
    description: DynamoDB hash key (partition key)
  serverless-starter:dynamodbBillingMode:
    type: string
    default: PAY_PER_REQUEST
    description: DynamoDB billing mode (PAY_PER_REQUEST or PROVISIONED)
  serverless-starter:dynamodbEnablePITR:
    type: boolean
    default: true
    description: Enable point-in-time recovery
  serverless-starter:dynamodbEnableEncryption:
    type: boolean
    default: true
    description: Enable server-side encryption

  # Lambda Configuration (Auto-Discovery)
  serverless-starter:lambdaAutoDiscover:
    type: boolean
    default: true
    description: Auto-discover Lambda functions from lambda_functions directory
  serverless-starter:lambdaFunctionsDirectory:
    type: string
    default: ./lambda_functions
    description: Directory containing Lambda function subdirectories
  serverless-starter:lambdaDefaultRuntime:
    type: string
    default: python3.11
    description: Default Lambda runtime (e.g., python3.11, nodejs20.x)
  serverless-starter:lambdaDefaultHandler:
    type: string
    default: index.handler
    description: Default Lambda handler path
  serverless-starter:lambdaDefaultMemorySize:
    type: integer
    default: 256
    description: Default Lambda memory size in MB
  serverless-starter:lambdaDefaultTimeout:
    type: integer
    default: 30
    description: Default Lambda timeout in seconds

  # API Gateway Configuration
  serverless-starter:apiGatewayDefaultName:
    type: string
    default: serverless-api
    description: Default API Gateway name (used when no mappings specified)
  serverless-starter:apiGatewayMappings:
    type: string
    default: ""
    description: |
      API Gateway to Lambda function mappings. Format: "api-name:func1,func2;another-api:func3"
      Leave empty to map all functions to default API Gateway.
      Example: "app1-api:hello,world;app2-api:user,auth"

  # Custom Domain Configuration (Optional)
  serverless-starter:enableCustomDomain:
    type: boolean
    default: false
    description: Enable custom domain for API Gateway
  serverless-starter:domainName:
    type: string
    default: ""
    description: Base domain name (e.g., example.com) - required if enableCustomDomain is true
  serverless-starter:subdomain:
    type: string
    default: api
    description: Subdomain prefix for API (e.g., api for api.example.com)
